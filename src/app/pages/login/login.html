<div class=" px-6 py-20 md:px-20 lg:px-80 h-screen">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()"
    class="bg-surface-0 dark:bg-surface-900 p-8 md:p-12 shadow-sm rounded-2xl w-full max-w-sm mx-auto flex flex-col gap-8">
    <div class="flex flex-col items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="Szbk-Logo1.svg" alt="Bekalla Logo" class="w-20" />
      </div>
      <div class="flex flex-col items-center gap-2 w-full">
        <div class="text-surface-900 dark:text-surface-0 text-2xl font-semibold leading-tight text-center w-full">
          Welcome Back</div>
        @if(errorMessage()) {
        <p-message severity="error">{{ errorMessage() }}</p-message>
        }
      </div>
    </div>
    <div class="flex flex-col gap-6 w-full">
      <div class="flex flex-col gap-2 w-full">
        <label for="email" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Email
          Address</label>
        <input formControlName="email" pInputText id="email" type="text" placeholder="Email address"
          class="w-full px-3 py-2 shadow-sm rounded-lg border dark:border-gray-300" />
      </div>
      <div class="flex flex-col gap-2 w-full">
        <label for="password" class="text-surface-900 dark:text-surface-0 font-medium leading-normal">Password</label>
        <input formControlName="password" pInputText id="password" type="password" placeholder="Password"
          class="w-full px-3 py-2 shadow-sm rounded-lg border dark:border-gray-300" />
      </div>
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full gap-3 sm:gap-0">
        <a class="text-primary font-medium cursor-pointer hover:text-primary-emphasis">Forgot your password?</a>
      </div>
    </div>
    <button [disabled]="!loginForm.valid" pButton class="w-full py-2 rounded-lg flex justify-center items-center gap-2">
      <i pButtonIcon class="pi pi-user text-base! leading-normal!"></i>
      <span pButtonLabel>Sign In</span>
    </button>
  </form>
</div>
